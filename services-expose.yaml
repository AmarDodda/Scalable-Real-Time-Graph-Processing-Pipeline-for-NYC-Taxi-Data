apiVersion: v1
kind: Service
metadata:
  name: neo4j-external
spec:
  selector:
    app: neo4j-standalone
  type: NodePort
  ports:
    - name: http-browser
      port: 7474
      targetPort: 7474
      nodePort: 30001
    - name: bolt-connector
      port: 7687
      targetPort: 7687
      nodePort: 30002

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
spec:
  selector:
    app: kafka-broker
  type: NodePort
  ports:
    - name: kafka-protocol
      port: 9092
      targetPort: 9092
      nodePort: 30003